services:
  # Первый контейнер: наш сайт на ASP.NET Core 10
  web:
    build: ./CloudShop
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=shopdb;Username=postgres;Password=postgres
    depends_on:
      - db

  # Второй контейнер: база данных PostgreSQL
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=shopdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
