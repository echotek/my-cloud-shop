name: CI/CD — Сборка и публикация Docker-образа

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: 2. Устанавливаем .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Проверяем сборку C# проекта
        run: dotnet build ./CloudShop/CloudShop.csproj --configuration Release

      - name: 4. Авторизуемся в реестре контейнеров GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Собираем и публикуем Docker-образ в облако
        uses: docker/build-push-action@v5
        with:
          context: ./CloudShop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-cloud-shop:latest
git add .